name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npx astro build
        env:
          YANDEX_METRICA_ID: ${{ secrets.YANDEX_METRICA_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ubuyer-site

# Functions деплой убран из CI намеренно:
# Firebase Functions v2 требуют 8+ ролей у service account (Cloud Functions,
# Cloud Run, Artifact Registry, Secret Manager, Cloud Build, Eventarc, etc).
# Каждая роль вылезает отдельной ошибкой при попытке деплоя.
#
# Деплой функций — вручную одной командой с компа Тимура (он Owner проекта):
#   cd ubuyer-site
#   firebase deploy --only functions
#
# Делать это нужно после изменений в:
#   - functions/src/*.ts
#   - functions/knowledge/*.md (системная инструкция или knowledge Анастасии)
#
# В среднем — раз в неделю-две. Не часто.
